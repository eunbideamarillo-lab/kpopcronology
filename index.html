<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-POP Archive Hub & Fandom Zone (2019 - Presente)</title>

    <!-- Código oficial de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6836041116623012"
     crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #13151f;
            --bg-card: #1c1f2e;
            --accent-pink: #ff2a74;
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --accent-yellow: #ffb703;
            --accent-tiktok: #00f2fe;
            --text-main: #f0f2f8;
            --text-muted: #a0a5ba;
            --border-color: #2e334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Navigation Sidebar */
        aside {
            width: 290px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            overflow-y: auto;
            z-index: 10;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-card);
            padding: 0.4rem;
            border-radius: 8px;
        }

        .nav-btn {
            width: 100%;
            padding: 0.6rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn.active {
            background: var(--accent-pink);
            color: #fff;
        }

        .nav-btn.tiktok-tab.active {
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            color: #fff;
        }

        .filter-group {
            margin-bottom: 1.2rem;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }

        /* Workspace Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats-bar span {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        /* Grid Layout */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .card {
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-pink);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .thumbnail-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .badge {
            font-size: 0.68rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-debut { background: rgba(255, 42, 116, 0.2); color: var(--accent-pink); }
        .badge-comeback { background: rgba(138, 43, 226, 0.2); color: var(--accent-purple); }
        .badge-stage { background: rgba(0, 210, 255, 0.2); color: var(--accent-blue); }
        .badge-cat { background: rgba(255, 183, 3, 0.15); color: var(--accent-yellow); border: 1px solid rgba(255, 183, 3, 0.3); }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.5rem;
        }

        .vote-btn-sm {
            background: rgba(255, 42, 116, 0.15);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .vote-btn-sm:hover {
            background: var(--accent-pink);
            color: white;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.85rem;
        }

        .btn-sec {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* Sección TikTok */
        .tiktok-header-card {
            background: linear-gradient(135deg, rgba(255,0,80,0.15), rgba(0,242,254,0.15));
            border: 1px solid rgba(0,242,254,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tiktok-profile-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tiktok-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .btn-tiktok {
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s;
        }

        .btn-tiktok:hover {
            transform: scale(1.05);
        }

        .tiktok-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .tiktok-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tiktok-embed-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 400px;
        }

        /* Fandom Zone Views */
        .fandom-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .fandom-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .fandom-card h2 {
            font-size: 1.2rem;
            color: var(--accent-blue);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .poll-item {
            margin-bottom: 1.2rem;
            background: var(--bg-card);
            padding: 0.8rem;
            border-radius: 8px;
        }

        .poll-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-blue));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Modal Forms */
        .modal {
            display: none;
            position fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 { margin-bottom: 1rem; }
        .form-control { margin-bottom: 1rem; }
        .form-control label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--text-muted); }
        .form-control input, .form-control select {
            width: 100%; padding: 0.6rem; background: var(--bg-card);
            border: 1px solid var(--border-color); color: white; border-radius: 6px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1rem; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            aside { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            main { height: auto; }
            .content-area { padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Panel Lateral de Navegación y Filtros -->
    <aside>
        <div class="logo">⚡ K-POP HUB</div>

        <div class="nav-tabs">
            <button class="nav-btn active" id="tabArchiveBtn" onclick="switchTab('archive')">📺 Catálogo K-Pop</button>
            <button class="nav-btn" id="tabFandomBtn" onclick="switchTab('fandom')">👑 Fandom Zone</button>
            <button class="nav-btn tiktok-tab" id="tabTiktokBtn" onclick="switchTab('tiktok')">🎵 TikTok (@eduardgi07)</button>
        </div>
        
        <div id="filterSection">
            <div class="filter-group">
                <label>Buscar Artista / Canción</label>
                <input type="text" id="searchInput" placeholder="Ej: aespa, NewJeans, TWS..." oninput="filterData()">
            </div>

            <div class="filter-group">
                <label>Categoría</label>
                <select id="categoryFilter" onchange="filterData()">
                    <option value="ALL">Todas las Categorías</option>
                    <option value="Boy Group">Boy Group</option>
                    <option value="Girl Group">Girl Group</option>
                    <option value="Soloist">Solista</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Año</label>
                <select id="yearFilter" onchange="filterData()">
                    <option value="ALL">Todos los Años (2019-2026)</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Tipo de Evento</label>
                <select id="typeFilter" onchange="filterData()">
                    <option value="ALL">Todos los tipos</option>
                    <option value="Debut">Debut</option>
                    <option value="Comeback">Comeback</option>
                    <option value="Stage">Stage Performance</option>
                </select>
            </div>
        </div>
    </aside>

    <!-- Área Principal -->
    <main>
        <header>
            <div class="stats-bar">
                <p>Registros: <span id="totalCount">0</span></p>
                <p>Votos Totales: <span id="totalVotesCount">0</span></p>
            </div>
            <div class="action-buttons">
                <button class="btn btn-sec" onclick="exportData()">💾 Respaldar</button>
                <button class="btn" onclick="toggleModal(true)">+ Agregar Video</button>
            </div>
        </header>

        <!-- Vista de Catálogo de Videos K-Pop -->
        <div class="content-area" id="archiveView">
            <div class="grid-layout" id="gridContent">
                <!-- Tarjetas dinámicas -->
            </div>
        </div>

        <!-- Vista Fandom Zone -->
        <div class="content-area" id="fandomView" style="display: none;">
            <div class="fandom-container">
                <div class="fandom-card">
                    <h2>🔥 Canción & MV del Año (Ranking)</h2>
                    <div id="videoPollList"></div>
                </div>

                <div class="fandom-card">
                    <h2>👑 Idol & Grupo Favorito</h2>
                    <div id="idolPollList"></div>
                    <button class="btn" style="width: 100%; margin-top: 1rem;" onclick="addCustomIdolPrompt()">+ Proponer Idol/Grupo</button>
                </div>
            </div>
        </div>

        <!-- Vista TikTok Section -->
        <div class="content-area" id="tiktokView" style="display: none;">
            <!-- Header Perfil TikTok -->
            <div class="tiktok-header-card">
                <div class="tiktok-profile-info">
                    <div class="tiktok-avatar">🎵</div>
                    <div>
                        <h2 style="color: #fff; font-size: 1.4rem;">@eduardgi07</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">Perfil Oficial de TikTok & Contenido K-Pop / Dance / Lifestyle</p>
                    </div>
                </div>
                <a href="https://www.tiktok.com/@eduardgi07" target="_blank" rel="noopener noreferrer" class="btn-tiktok">
                    <span>Seguir en TikTok</span> ↗
                </a>
            </div>

            <h3 style="margin-bottom: 1.2rem; color: var(--accent-blue);">📹 Videos Destacados</h3>
            <div class="tiktok-grid" id="tiktokGrid">
                <!-- Se cargan dinámicamente los embeds de TikTok -->
            </div>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Registrar Nuevo Video / Release</h2>
            <form id="kpopForm" onsubmit="addEntry(event)">
                <div class="form-control">
                    <label>Nombre del Grupo / Solista</label>
                    <input type="text" id="artistInput" required placeholder="Ej: ILLIT">
                </div>
                <div class="form-control">
                    <label>Título de la Canción</label>
                    <input type="text" id="titleInput" required placeholder="Ej: Magnetic">
                </div>
                <div class="form-control">
                    <label>Categoría</label>
                    <select id="categoryInput">
                        <option value="Girl Group">Girl Group</option>
                        <option value="Boy Group">Boy Group</option>
                        <option value="Soloist">Solista</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Tipo de Evento</label>
                    <select id="typeInput">
                        <option value="Debut">Debut</option>
                        <option value="Comeback">Comeback</option>
                        <option value="Stage">Stage Performance</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Fecha de Lanzamiento</label>
                    <input type="date" id="dateInput" required>
                </div>
                <div class="form-control">
                    <label>ID de YouTube</label>
                    <input type="text" id="ytIdInput" required placeholder="Ej: Vk5-c_v4gMU">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-sec" onclick="toggleModal(false)">Cancelar</button>
                    <button type="submit" class="btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Embeds de TikTok -->
    <script async src="https://www.tiktok.com/embed.js"></script>

    <script>
        // Lista de TikToks
        let tiktokVideos = [
            { id: "1", title: "TikTok Destacado 1", videoId: "7345678901234567890" },
            { id: "2", title: "TikTok Destacado 2", videoId: "7345678901234567891" }
        ];

        // Base de Datos K-Pop
        let archiveData = [
            { id: 601, artist: "MEOVV", title: "MEOW", category: "Girl Group", type: "Debut", date: "2024-09-06", ytId: "3m39s-5c4d8", votes: 42 },
            { id: 602, artist: "izna", title: "IZNA", category: "Girl Group", type: "Debut", date: "2024-11-25", ytId: "9S_JAnL_4dY", votes: 38 },
            { id: 603, artist: "NEXZ", title: "Ride the Vibe", category: "Boy Group", type: "Debut", date: "2024-05-20", ytId: "84K2xM1L0p0", votes: 19 },
            { id: 501, artist: "TWS", title: "Plot Twist", category: "Boy Group", type: "Debut", date: "2024-01-22", ytId: "hVAc1Vf2mSc", votes: 54 },
            { id: 503, artist: "ILLIT", title: "Magnetic", category: "Girl Group", type: "Debut", date: "2024-03-25", ytId: "Vk5-c_v4gMU", votes: 110 },
            { id: 504, artist: "BABYMONSTER", title: "SHEESH", category: "Girl Group", type: "Debut", date: "2024-04-01", ytId: "2wA_T83m3mU", votes: 98 },
            { id: 404, artist: "KISS OF LIFE", title: "Shh", category: "Girl Group", type: "Debut", date: "2023-07-05", ytId: "f4n6mJ2_U28", votes: 87 },
            { id: 405, artist: "ZEROBASEONE", title: "In Bloom", category: "Boy Group", type: "Debut", date: "2023-07-10", ytId: "tI8K_c8W4aE", votes: 92 },
            { id: 406, artist: "RIIZE", title: "Get A Guitar", category: "Boy Group", type: "Debut", date: "2023-09-04", ytId: "iA_c_K4d2jE", votes: 89 },
            { id: 303, artist: "LE SSERAFIM", title: "FEARLESS", category: "Girl Group", type: "Debut", date: "2022-05-02", ytId: "4vbDFu0PUew", votes: 105 },
            { id: 305, artist: "NewJeans", title: "Attention", category: "Girl Group", type: "Debut", date: "2022-07-22", ytId: "js1CtxSY38I", votes: 140 },
            { id: 224, artist: "IVE", title: "ELEVEN", category: "Girl Group", type: "Debut", date: "2021-12-01", ytId: "--FmExEAsM8", votes: 125 },
            { id: 215, artist: "aespa", title: "Black Mamba", category: "Girl Group", type: "Debut", date: "2020-11-17", ytId: "ZeerrnuLi5E", votes: 130 },
            { id: 217, artist: "ENHYPEN", title: "Given-Taken", category: "Boy Group", type: "Debut", date: "2020-11-30", ytId: "nQ6wLuYvGd4", votes: 115 },
            { id: 3, artist: "Wonho", title: "Open Mind", category: "Soloist", type: "Debut", date: "2020-09-04", ytId: "3C-mR0-pGls", votes: 150 }
        ];

        let idolPollData = [
            { name: "Wonho", votes: 210 },
            { name: "aespa", votes: 185 },
            { name: "NewJeans", votes: 170 },
            { name: "Stray Kids", votes: 165 },
            { name: "ENHYPEN", votes: 140 },
            { name: "ILLIT", votes: 120 }
        ];

        if (localStorage.getItem('kpopArchiveV2')) {
            archiveData = JSON.parse(localStorage.getItem('kpopArchiveV2'));
        }
        if (localStorage.getItem('kpopIdolPoll')) {
            idolPollData = JSON.parse(localStorage.getItem('kpopIdolPoll'));
        }

        function saveData() {
            localStorage.setItem('kpopArchiveV2', JSON.stringify(archiveData));
            localStorage.setItem('kpopIdolPoll', JSON.stringify(idolPollData));
        }

        function switchTab(tab) {
            document.getElementById('archiveView').style.display = tab === 'archive' ? 'block' : 'none';
            document.getElementById('fandomView').style.display = tab === 'fandom' ? 'block' : 'none';
            document.getElementById('tiktokView').style.display = tab === 'tiktok' ? 'block' : 'none';
            document.getElementById('filterSection').style.display = tab === 'archive' ? 'block' : 'none';

            document.getElementById('tabArchiveBtn').classList.toggle('active', tab === 'archive');
            document.getElementById('tabFandomBtn').classList.toggle('active', tab === 'fandom');
            document.getElementById('tabTiktokBtn').classList.toggle('active', tab === 'tiktok');

            if (tab === 'fandom') {
                renderFandomZone();
            } else if (tab === 'tiktok') {
                renderTiktokSection();
            }
        }

        function renderTiktokSection() {
            const container = document.getElementById('tiktokGrid');
            container.innerHTML = `
                <div class="tiktok-card">
                    <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@eduardgi07" data-unique-id="eduardgi07" data-embed-type="creator" style="max-width: 100%; min-width: 280px;">
                        <section>
                            <a target="_blank" href="https://www.tiktok.com/@eduardgi07?refer=creator_embed">@eduardgi07</a>
                        </section>
                    </blockquote>
                </div>
            `;
            if (window.tiktokEmbed) {
                window.tiktokEmbed.load();
            }
        }

        function renderCards(data) {
            const grid = document.getElementById('gridContent');
            grid.innerHTML = '';

            document.getElementById('totalCount').innerText = data.length;
            const totalVotes = archiveData.reduce((acc, curr) => acc + (curr.votes || 0), 0);
            document.getElementById('totalVotesCount').innerText = totalVotes;

            data.forEach(item => {
                const year = new Date(item.date).getFullYear();
                const badgeClass = item.type === 'Debut' ? 'badge-debut' : item.type === 'Comeback' ? 'badge-comeback' : 'badge-stage';

                const cardHtml = `
                    <div class="card">
                        <div class="thumbnail-wrapper">
                            <iframe src="https://www.youtube.com/embed/${item.ytId}" allowfullscreen loading="lazy"></iframe>
                        </div>
                        <div class="card-info">
                            <div class="badge-container">
                                <span class="badge ${badgeClass}">${item.type}</span>
                                <span class="badge badge-cat">${item.category}</span>
                                <span class="badge" style="background:rgba(255,255,255,0.1); color:#fff;">${year}</span>
                            </div>
                            <div class="card-title">${item.artist} - ${item.title}</div>
                            <div class="card-meta">
                                <span>📅 ${item.date}</span>
                                <button class="vote-btn-sm" onclick="voteVideo(${item.id})">❤️ ${item.votes || 0}</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const year = document.getElementById('yearFilter').value;
            const type = document.getElementById('typeFilter').value;

            const filtered = archiveData.filter(item => {
                const matchesSearch = item.artist.toLowerCase().includes(search) || item.title.toLowerCase().includes(search);
                const matchesCategory = (category === 'ALL') || (item.category === category);
                const itemYear = new Date(item.date).getFullYear().toString();
                const matchesYear = (year === 'ALL') || (itemYear === year);
                const matchesType = (type === 'ALL') || (item.type === type);

                return matchesSearch && matchesCategory && matchesYear && matchesType;
            });

            renderCards(filtered);
        }

        function voteVideo(id) {
            const item = archiveData.find(x => x.id === id);
            if (item) {
                item.votes = (item.votes || 0) + 1;
                saveData();
                filterData();
            }
        }

        function renderFandomZone() {
            const sortedVideos = [...archiveData].sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 5);
            const videoPollContainer = document.getElementById('videoPollList');
            videoPollContainer.innerHTML = '';
            const maxVideoVotes = sortedVideos[0]?.votes || 1;

            sortedVideos.forEach((v, index) => {
                const pct = Math.round(((v.votes || 0) / maxVideoVotes) * 100);
                videoPollContainer.innerHTML += `
                    <div class="poll-item">
                        <div class="poll-header">
                            <strong>#${index + 1} ${v.artist} - ${v.title}</strong>
                            <span>${v.votes || 0} votos</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${pct}%;"></div>
                        </div>
                        <button class="vote-btn-sm" onclick="voteVideo(${v.id}); renderFandomZone();">Votar por esta canción</button>
                    </div>
                `;
            });

            const sortedIdols = [...idolPollData].sort((a, b) => b.votes - a.votes);
            const idolPollContainer = document.getElementById('idolPollList');
            idolPollContainer.innerHTML = '';
            const maxIdolVotes = sortedIdols[0]?.votes || 1;

            sortedIdols.forEach((i, index) => {
                const pct = Math.round((i.votes / maxIdolVotes) * 100);
                idolPollContainer.innerHTML += `
                    <div class="poll-item">
                        <div class="poll-header">
                            <strong>#${index + 1} ${i.name}</strong>
                            <span>${i.votes} votos</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${pct}%;"></div>
                        </div>
                        <button class="vote-btn-sm" onclick="voteIdol('${i.name}')">Votar por ${i.name}</button>
                    </div>
                `;
            });
        }

        function voteIdol(name) {
            const idol = idolPollData.find(x => x.name === name);
            if (idol) {
                idol.votes += 1;
                saveData();
                renderFandomZone();
            }
        }

        function addCustomIdolPrompt() {
            const name = prompt("Escribe el nombre del Idol o Grupo:");
            if (name && name.trim() !== '') {
                const exists = idolPollData.find(x => x.name.toLowerCase() === name.trim().toLowerCase());
                if (!exists) {
                    idolPollData.push({ name: name.trim(), votes: 1 });
                    saveData();
                    renderFandomZone();
                } else {
                    alert("¡Este artista ya está en la lista!");
                }
            }
        }

        function toggleModal(show) {
            document.getElementById('addModal').style.display = show ? 'flex' : 'none';
        }

        function addEntry(e) {
            e.preventDefault();
            const newEntry = {
                id: Date.now(),
                artist: document.getElementById('artistInput').value,
                title: document.getElementById('titleInput').value,
                category: document.getElementById('categoryInput').value,
                type: document.getElementById('typeInput').value,
                date: document.getElementById('dateInput').value,
                ytId: document.getElementById('ytIdInput').value,
                votes: 1
            };

            archiveData.unshift(newEntry);
            saveData();
            filterData();
            toggleModal(false);
            document.getElementById('kpopForm').reset();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archiveData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "kpop_archive_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        filterData();
    </script>
</body>
</html>
