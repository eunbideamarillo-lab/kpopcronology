<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-POP Archive Hub (2019 - Presente)</title>
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #13151f;
            --bg-card: #1c1f2e;
            --accent-pink: #ff2a74;
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --accent-yellow: #ffb703;
            --text-main: #f0f2f8;
            --text-muted: #a0a5ba;
            --border-color: #2e334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 270px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            overflow-y: auto;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            text-align: center;
        }

        .filter-group {
            margin-bottom: 1.2rem;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats-bar span {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        /* Video / Release Cards */
        .card {
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-pink);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .thumbnail-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .badge {
            font-size: 0.68rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-debut { background: rgba(255, 42, 116, 0.2); color: var(--accent-pink); }
        .badge-comeback { background: rgba(138, 43, 226, 0.2); color: var(--accent-purple); }
        .badge-stage { background: rgba(0, 210, 255, 0.2); color: var(--accent-blue); }
        .badge-cat { background: rgba(255, 183, 3, 0.15); color: var(--accent-yellow); border: 1px solid rgba(255, 183, 3, 0.3); }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            display: flex;
            justify-content: space-between;
        }

        /* Floating Add Button */
        .btn-add {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:hover { opacity: 0.9; }

        /* Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        .modal-content h2 { margin-bottom: 1rem; }
        .form-control { margin-bottom: 1rem; }
        .form-control label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; }
        .form-control input, .form-control select {
            width: 100%; padding: 0.6rem; background: var(--bg-card);
            border: 1px solid var(--border-color); color: white; border-radius: 6px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; }
    </style>
</head>
<body>

    <!-- Panel de Control y Filtros -->
    <aside>
        <div class="logo">K-ARCHIVE 2019+</div>
        
        <div class="filter-group">
            <label>Buscar Artista / Canción</label>
            <input type="text" id="searchInput" placeholder="Ej: ITZY, TXT, Wonho..." oninput="filterData()">
        </div>

        <div class="filter-group">
            <label>Categoría</label>
            <select id="categoryFilter" onchange="filterData()">
                <option value="ALL">Todas las Categorías</option>
                <option value="Boy Group">Boy Group</option>
                <option value="Girl Group">Girl Group</option>
                <option value="Soloist">Solista</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Año</label>
            <select id="yearFilter" onchange="filterData()">
                <option value="ALL">Todos los años</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Tipo de Evento</label>
            <select id="typeFilter" onchange="filterData()">
                <option value="ALL">Todos los tipos</option>
                <option value="Debut">Debut</option>
                <option value="Comeback">Comeback</option>
                <option value="Stage">Stage Performance</option>
            </select>
        </div>
    </aside>

    <!-- Área Principal -->
    <main>
        <header>
            <div class="stats-bar">
                <p>Registros en Sistema: <span id="totalCount">0</span></p>
            </div>
            <button class="btn-add" onclick="toggleModal(true)">+ Registrar Nuevo Video</button>
        </header>

        <div class="content-area" id="gridContent">
            <!-- Las tarjetas se generan dinámicamente -->
        </div>
    </main>

    <!-- Modal para Agregar Nuevos Registros -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Agregar Nuevo Registro K-Pop</h2>
            <form id="kpopForm" onsubmit="addEntry(event)">
                <div class="form-control">
                    <label>Nombre del Grupo / Solista</label>
                    <input type="text" id="artistInput" required placeholder="Ej: ITZY">
                </div>
                <div class="form-control">
                    <label>Título de la Canción / Stage</label>
                    <input type="text" id="titleInput" required placeholder="Ej: DALLA DALLA">
                </div>
                <div class="form-control">
                    <label>Categoría</label>
                    <select id="categoryInput">
                        <option value="Boy Group">Boy Group</option>
                        <option value="Girl Group">Girl Group</option>
                        <option value="Soloist">Solista</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Tipo de Evento</label>
                    <select id="typeInput">
                        <option value="Comeback">Comeback</option>
                        <option value="Debut">Debut</option>
                        <option value="Stage">Stage Performance</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Fecha de Lanzamiento</label>
                    <input type="date" id="dateInput" required>
                </div>
                <div class="form-control">
                    <label>ID del Video de YouTube</label>
                    <input type="text" id="ytIdInput" required placeholder="Ej: pNfTK39KiE8 (Código tras v=)">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-add" style="background:#555;" onclick="toggleModal(false)">Cancelar</button>
                    <button type="submit" class="btn-add">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Base de datos actualizada con los debuts de 2019
        let archiveData = [
            // Debuts de 2019
            { id: 101, artist: "ONEUS", title: "Valkyrie", category: "Boy Group", type: "Debut", date: "2019-01-09", ytId: "k6mTP339u3w" },
            { id: 102, artist: "VERIVERY", title: "Ring Ring Ring", category: "Boy Group", type: "Debut", date: "2019-01-09", ytId: "m9LzF0iTz6c" },
            { id: 103, artist: "WayV", title: "Regular", category: "Boy Group", type: "Debut", date: "2019-01-17", ytId: "K-R-e4l6cZ8" },
            { id: 104, artist: "Cherry Bullet", title: "Q&A", category: "Girl Group", type: "Debut", date: "2019-01-21", ytId: "5_3fA1P_UoA" },
            { id: 105, artist: "ITZY", title: "DALLA DALLA", category: "Girl Group", type: "Debut", date: "2019-02-11", ytId: "pNfTK39KiE8" },
            { id: 106, artist: "TXT", title: "CROWN", category: "Boy Group", type: "Debut", date: "2019-03-04", ytId: "W3iSnJ634pE" },
            { id: 107, artist: "EVERGLOW", title: "Bon Bon Chocolat", category: "Girl Group", type: "Debut", date: "2019-03-18", ytId: "HvGql8HwIIM" },
            { id: 108, artist: "1TEAM", title: "VIBE", category: "Boy Group", type: "Debut", date: "2019-03-27", ytId: "o4A_-zmsyps" },
            { id: 109, artist: "BVNDIT", title: "Hocus Pocus", category: "Girl Group", type: "Debut", date: "2019-04-10", ytId: "yX8-9Rk5vJc" },
            { id: 110, artist: "1THE9", title: "Spotlight", category: "Boy Group", type: "Debut", date: "2019-04-13", ytId: "kP38sA9-f7w" },
            { id: 111, artist: "DKZ", title: "NOM", category: "Boy Group", type: "Debut", date: "2019-04-24", ytId: "9k6S_v1386w" },
            { id: 112, artist: "Newkidd", title: "Tu eres", category: "Boy Group", type: "Debut", date: "2019-04-25", ytId: "YmD9I7P4tYI" },
            { id: 113, artist: "AB6IX", title: "BREATHE", category: "Boy Group", type: "Debut", date: "2019-05-22", ytId: "M8UpWyL-600" },
            { id: 114, artist: "OnlyOneOf", title: "savannA", category: "Boy Group", type: "Debut", date: "2019-05-28", ytId: "q5PqQ7f9C3k" },
            { id: 115, artist: "3YE", title: "DMT (Do Ma Thing)", category: "Girl Group", type: "Debut", date: "2019-05-21", ytId: "I_rQG3_O5fM" },
            { id: 116, artist: "CIX", title: "Movie Star", category: "Boy Group", type: "Debut", date: "2019-07-23", ytId: "5_X8pM2682s" },
            { id: 117, artist: "Rocket Punch", title: "BIM BAM BUM", category: "Girl Group", type: "Debut", date: "2019-08-07", ytId: "R134fK96A-U" },
            { id: 118, artist: "X1", title: "FLASH", category: "Boy Group", type: "Debut", date: "2019-08-27", ytId: "LlQEKB2C7z8" },
            { id: 119, artist: "SuperM", title: "Jopping", category: "Boy Group", type: "Debut", date: "2019-10-04", ytId: "p1bjnyDqI9k" },
            { id: 120, artist: "HINAPIA", title: "DRIP", category: "Girl Group", type: "Debut", date: "2019-11-03", ytId: "2a1XN91U9S0" },

            // Ejemplos de años posteriores
            { id: 1, artist: "NewJeans", title: "Attention", category: "Girl Group", type: "Debut", date: "2022-07-22", ytId: "js1CtxSY38I" },
            { id: 2, artist: "BTS", title: "Dynamite", category: "Boy Group", type: "Comeback", date: "2020-08-21", ytId: "gdZLi9oWNZg" },
            { id: 3, artist: "Wonho", title: "Open Mind", category: "Soloist", type: "Debut", date: "2020-09-04", ytId: "3C-mR0-pGls" },
            { id: 4, artist: "LE SSERAFIM", title: "EASY (Live Stage)", category: "Girl Group", type: "Stage", date: "2024-02-22", ytId: "bNKXxnJ3E5Y" },
            { id: 5, artist: "Aespa", title: "Black Mamba", category: "Girl Group", type: "Debut", date: "2020-11-17", ytId: "ZeerrnuLi5E" },
            { id: 6, artist: "Stray Kids", title: "Maniac", category: "Boy Group", type: "Comeback", date: "2022-03-18", ytId: "OvioeS1ZZ7o" }
        ];

        // Cargar datos del almacenamiento local si existen
        if (localStorage.getItem('kpopArchive')) {
            archiveData = JSON.parse(localStorage.getItem('kpopArchive'));
        }

        function renderCards(data) {
            const grid = document.getElementById('gridContent');
            grid.innerHTML = '';

            document.getElementById('totalCount').innerText = data.length;

            data.forEach(item => {
                const year = new Date(item.date).getFullYear();
                const badgeClass = item.type === 'Debut' ? 'badge-debut' : item.type === 'Comeback' ? 'badge-comeback' : 'badge-stage';
                const itemCategory = item.category || 'General';

                const cardHtml = `
                    <div class="card">
                        <div class="thumbnail-wrapper">
                            <iframe src="https://www.youtube.com/embed/${item.ytId}" allowfullscreen></iframe>
                        </div>
                        <div class="card-info">
                            <div class="badge-container">
                                <span class="badge ${badgeClass}">${item.type}</span>
                                <span class="badge badge-cat">${itemCategory}</span>
                                <span class="badge" style="background:rgba(255,255,255,0.1); color:#fff;">${year}</span>
                            </div>
                            <div class="card-title">${item.artist} - ${item.title}</div>
                            <div class="card-meta">
                                <span>📅 ${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const year = document.getElementById('yearFilter').value;
            const type = document.getElementById('typeFilter').value;

            const filtered = archiveData.filter(item => {
                const matchesSearch = item.artist.toLowerCase().includes(search) || item.title.toLowerCase().includes(search);
                const matchesCategory = (category === 'ALL') || (item.category === category);
                const itemYear = new Date(item.date).getFullYear().toString();
                const matchesYear = (year === 'ALL') || (itemYear === year);
                const matchesType = (type === 'ALL') || (item.type === type);

                return matchesSearch && matchesCategory && matchesYear && matchesType;
            });

            renderCards(filtered);
        }

        function toggleModal(show) {
            document.getElementById('addModal').style.display = show ? 'flex' : 'none';
        }

        function addEntry(e) {
            e.preventDefault();
            const newEntry = {
                id: Date.now(),
                artist: document.getElementById('artistInput').value,
                title: document.getElementById('titleInput').value,
                category: document.getElementById('categoryInput').value,
                type: document.getElementById('typeInput').value,
                date: document.getElementById('dateInput').value,
                ytId: document.getElementById('ytIdInput').value
            };

            archiveData.unshift(newEntry);
            localStorage.setItem('kpopArchive', JSON.stringify(archiveData));
            
            filterData();
            toggleModal(false);
            document.getElementById('kpopForm').reset();
        }

        // Renderizado inicial
        filterData();
    </script>
</body>
</html>
